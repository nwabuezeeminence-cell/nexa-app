<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to NEXA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glass-card intro-card">
    
    <div class="slide" id="slide1">
      <img src="https://i.imgur.com/8Km9tLL.png" alt="Connect">
      <h2>Connect With Everyone</h2>
      <p class="subtitle">Chat, call, and share moments with friends in real-time</p>
    </div>

    <div class="slide" id="slide2" style="display: none;">
      <img src="https://i.imgur.com/Qw3G6Em.png" alt="Secure">
      <h2>100% Private & Secure</h2>
      <p class="subtitle">Your messages are end-to-end encrypted. Always.</p>
    </div>

    <div class="slide" id="slide3" style="display: none;">
      <img src="https://i.imgur.com/V4R4VbP.png" alt="Fast">
      <h2>Fast & Beautiful</h2>
      <p class="subtitle">A clean, modern experience designed just for you</p>
    </div>

    <div class="dots">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <div class="intro-buttons">
      <button class="btn-outline" id="skipBtn">Skip</button>
      <button class="btn" id="nextBtn">Next</button>
      <button class="btn" id="getStartedBtn" style="display: none;">Get Started</button>
    </div>

  </div>

  <script type="module" src="intro.js"></script>
</body>
</html>
