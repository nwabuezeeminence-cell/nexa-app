<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>NEXA - Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
  :root {
    --bg: #04040a;
    --glass: rgba(15, 15, 23, 0.65);
    --glass-border: rgba(255, 26, 77, 0.25);
    --text: #f1f1f3;
    --text-muted: #8a8a96;
    --pink: #ff1a4d;
    --pink-glow: 0 0 25px rgba(255, 26, 77, 0.5);
    --radius: 20px;
  }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  html, body { height: 100%; width: 100%; }

  body { 
    background: var(--bg);
    color: var(--text);
    background-image: 
      radial-gradient(circle at 20% 20%, rgba(255,26,77,0.1) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(255,26,77,0.07) 0%, transparent 50%);
    background-attachment: fixed;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }

  .container {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    animation: fadeIn 0.6s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform: translateY(20px);} to { opacity:1; transform: translateY(0);} }

  /* THE GLASS CARD */
  .glass-card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .logo {
    text-align:center; margin-bottom:10px;
  }
  .logo i { font-size:50px; color:var(--pink); filter: drop-shadow(var(--pink-glow)); }
  .logo h1 { font-size:32px; margin-top:8px; letter-spacing:2px; }
  .logo p { color:var(--text-muted); font-size:13px; }

  .tabs { display:flex; gap:8px; background: rgba(0,0,0,0.3); padding:4px; border-radius:12px; }
  .tab { flex:1; padding:10px; border:none; background:transparent; color:var(--text-muted); border-radius:10px; font-weight:600; cursor:pointer; transition:0.3s; }
  .tab.active { background:var(--pink); color:#fff; box-shadow: var(--pink-glow); }

  .form { display:none; flex-direction:column; gap:16px; }
  .form.active { display:flex; }

  .input-group { position:relative; }
  .input-group i { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-muted); }
  .input-group input { 
    width:100%; padding:14px 14px 14px 44px; 
    background: rgba(255,255,255,0.05); 
    border:1px solid var(--glass-border); 
    border-radius:12px; 
    color:var(--text); font-size:15px;
  }
  .input-group input:focus { outline:none; border-color:var(--pink); box-shadow: 0 0 0 2px rgba(255,26,77,0.2); }

  .btn-primary { 
    width:100%; padding:15px; margin-top:8px; 
    background:var(--pink); color:#fff; 
    border:none; border-radius:12px; 
    font-weight:bold; font-size:16px; 
    cursor:pointer; box-shadow: var(--pink-glow);
    transition:0.2s;
  }
  .btn-primary:active { transform:scale(0.97); }

  .divider { display:flex; align-items:center; gap:10px; color:var(--text-muted); font-size:12px; }
  .divider::before, .divider::after { content:""; flex:1; height:1px; background:var(--glass-border); }

  .social-btn {
    width:100%; padding:12px; background: rgba(255,255,255,0.05);
    border:1px solid var(--glass-border); border-radius:12px;
    color:var(--text); display:flex; align-items:center; justify-content:center; gap:10px;
    cursor:pointer; transition:0.2s;
  }
  .social-btn:hover { border-color:var(--pink); }
  </style>
</head>
<body>
  <div class="container">

    <div class="logo">
      <i class="fas fa-comments"></i>
      <h1>NEXA</h1>
      <p>Connect. Chat. Create.</p>
    </div>

    <div class="glass-card">
      <div class="tabs">
        <button class="tab active" data-form="login">Login</button>
        <button class="tab" data-form="signup">Create Account</button>
      </div>

      <!-- LOGIN FORM -->
      <form class="form active" id="loginForm">
        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input type="email" placeholder="Email" required>
        </div>
        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" placeholder="Password" required>
        </div>
        <button type="submit" class="btn-primary">Login to NEXA</button>
      </form>

      <!-- SIGNUP FORM -->
      <form class="form" id="signupForm">
        <div class="input-group">
          <i class="fas fa-user"></i>
          <input type="text" placeholder="Username" required>
        </div>
        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input type="email" placeholder="Email" required>
        </div>
        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" placeholder="Create Password" required>
        </div>
        <button type="submit" class="btn-primary">Create NEXA Account</button>
      </form>

      <div class="divider">or continue with</div>

      <button class="social-btn"><i class="fab fa-google"></i> Google</button>
    </div>

  </div>

  <script>
    // TAB SWITCH
    document.querySelectorAll('.tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.form + 'Form').classList.add('active');
      }
    });

    // FAKE LOGIN - REPLACE WITH FIREBASE LATER
    document.getElementById('loginForm').onsubmit = (e) => {
      e.preventDefault();
      window.location.href = 'home.html'; // go to your glass home
    }
    document.getElementById('signupForm').onsubmit = (e) => {
      e.preventDefault();
      alert('Account Created! Welcome to NEXA');
      window.location.href = 'home.html';
    }
  </script>
</body>
</html>
