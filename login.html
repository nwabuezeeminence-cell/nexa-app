<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - NEXA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glass-card">
    <h2>Welcome Back</h2>
    <p class="subtitle">Login to continue to NEXA</p>

    <input type="text" id="loginInput" class="glass-input" placeholder="Email or Username or Phone" required>
    <input type="password" id="loginPassword" class="glass-input" placeholder="Password" required>

    <div style="text-align: right; margin-bottom: 15px;">
      <a href="forgot-password.html" class="footer-link">Forgot Password?</a>
    </div>

    <button class="btn" id="loginBtn">Login</button>

    <p class="footer-link">Don't have an account? <a href="create-account.html">Sign Up</a></p>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="login.js"></script>
</body>
</html>
