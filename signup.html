<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXA - Sign Up</title>
  <link rel="stylesheet" href="chat-dark.css">
</head>
<body class="auth-body">
  <div class="auth-container">
    <img src="nexa_dark_bg_preview.png" alt="NEXA Logo" class="auth-logo">
    <h2>Create Account</h2>
    <input type="email" id="signup-email" placeholder="Email">
    <input type="password" id="signup-password" placeholder="Password">
    <button id="signup-btn" class="btn">Sign Up</button>
    <p>Already have an account? <a href="login.html">Login</a></p>
    <p id="signup-error" class="error"></p>
  </div>
  <script type="module" src="firebase.js"></script>
</body>
</html>
