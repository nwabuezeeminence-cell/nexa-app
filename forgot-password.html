<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - NEXA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glass-card">
    <h2>Reset Password</h2>
    <p class="subtitle">Enter your email and we'll send you a reset link</p>

    <input type="email" id="resetEmail" class="glass-input" placeholder="Enter your Email Address" required>

    <button class="btn" id="resetBtn">Send Reset Link</button>

    <div class="intro-buttons" style="margin-top: 15px;">
      <button class="btn-outline back-btn" id="backToLogin">Back to Login</button>
    </div>
  </div>

  <script type="module" src="firebase.js"></script>
  <script type="module" src="forgot-password.js"></script>
</body>
</html>
