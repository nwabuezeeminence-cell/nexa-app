<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXA</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    body { background: #0a0a0f; color: white; }
    .loading-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; width: 100%; gap: 20px; background: #0a0a0f;
    }
    .loading-screen h2 {
      background: linear-gradient(135deg, #a18cd1, #fbc2eb);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      font-size: 24px; font-weight: 700; letter-spacing: 1px;
    }
    .loader {
      width: 45px; height: 45px;
      border: 4px solid rgba(161, 140, 209, 0.2);
      border-top: 4px solid #a18cd1; border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loading-screen">
    <h2>Loading NEXA...</h2>
    <div class="loader"></div>
  </div>

  <!-- LOAD FIREBASE FIRST -->
  <script src="firebase.js" type="module"></script>
  
  <!-- THEN RUN CHECK AFTER 500ms -->
  <script>
    function checkAuth() {
      if(typeof window.onAuthStateChanged === 'undefined') {
        setTimeout(checkAuth, 100); // wait until firebase loads
        return;
      }
      
      window.onAuthStateChanged(window.auth, (user) => {
        if (user) {
          window.location.href = "home.html";
        } else {
          window.location.href = "intro.html";
        }
      });
    }
    checkAuth();

    // Hard fallback after 3s
    setTimeout(() => {
      if(window.location.pathname.endsWith('index.html')) {
        window.location.href = "intro.html";
      }
    }, 3000);
  </script>
</body>
</html>
